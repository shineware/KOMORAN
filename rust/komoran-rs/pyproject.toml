[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "komoran"
version = "4.0.0"
description = "KOMORAN Korean Morphological Analyzer - Rust powered, Python native"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["korean", "nlp", "morphological-analyzer", "komoran", "형태소분석"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Korean",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/shin285/KOMORAN"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "komoran.komoran_rs"
