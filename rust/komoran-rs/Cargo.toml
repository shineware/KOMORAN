[package]
name = "komoran-rs"
version = "4.0.0"
edition = "2021"
description = "KOMORAN Korean Morphological Analyzer - Rust port with Python bindings"
license = "Apache-2.0"

[lib]
name = "komoran_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
byteorder = "1.5"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
