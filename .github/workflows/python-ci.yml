name: Python CI

on:
  push:
    branches: [master]
    paths:
      - 'rust/komoran-rs/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'rust/komoran-rs/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. OS별 wheel 빌드 (대표 Python 버전으로 빠르게 검증)
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (Linux x86_64)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --interpreter 3.10 3.12
          manylinux: auto
          working-directory: rust/komoran-rs

      - name: Build wheels (Linux aarch64)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist --interpreter 3.10 3.12
          manylinux: auto
          working-directory: rust/komoran-rs

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter 3.10 3.12
          working-directory: rust/komoran-rs

      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter 3.10 3.12
          working-directory: rust/komoran-rs

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: rust/komoran-rs/dist/*.whl

  # ──────────────────────────────────────────────
  # 2. 빌드된 wheel 설치 후 테스트
  # ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

      - name: Install wheel
        run: pip install komoran --find-links dist --no-index

      - name: Run tests
        run: |
          python -c "
          from komoran import Komoran

          k = Komoran()

          # analyze
          result = k.analyze('아버지가방에들어가신다')
          assert '아버지/NNG' in result, f'analyze failed: {result}'

          # nouns
          nouns = k.nouns('서울특별시는 대한민국의 수도이다')
          assert len(nouns) > 0, f'nouns failed: {nouns}'

          # pos
          pos = k.pos('나는 밥을 먹었다')
          assert ('나', 'NP') in pos, f'pos failed: {pos}'

          # tokens
          tokens = k.tokens('대한민국은 민주공화국이다')
          assert tokens[0].morph == '대한민국', f'tokens failed: {tokens[0].morph}'
          assert tokens[0].begin_index == 0
          assert tokens[0].end_index == 4

          # batch
          results = k.analyze_batch(['오늘 날씨가 좋다', '내일은 비가 온다'])
          assert len(results) == 2, f'batch failed: {len(results)}'

          print('All tests passed!')
          "
